<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Supriya</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600;1,800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1233;--bg2:#4a1d4e;--ink:#fff4ea;--rose:#ff8fab;--gold:#ffd27a;--card:#ffffff14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:Nunito,system-ui,sans-serif;text-align:center;overflow-x:hidden}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:14px}
h1,h2{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:800;margin:0;line-height:1.1}
h1{font-size:clamp(34px,9vw,60px)}
input{font:inherit;padding:12px 16px;border-radius:999px;border:1px solid #ffffff44;background:var(--card);color:var(--ink);text-align:center;width:min(300px,80vw)}
input::placeholder{color:#fff4ea99}
button{font:inherit;font-weight:600;padding:12px 26px;border-radius:999px;border:0;background:var(--gold);color:#3a1a2e;cursor:pointer}
button.ghost{background:var(--card);color:var(--ink);border:1px solid #ffffff44}
button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
#cake{width:min(300px,78vw)}
.flame{transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.12,.92) skewX(4deg)}}
.out .flame{display:none}
.smoke{opacity:0}
.out .smoke{animation:sm 2s ease-out forwards}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
#s2,#s3{display:none}
.frame{width:min(300px,76vw);aspect-ratio:5/6;border-radius:150px 150px 18px 18px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 8px #ffd27a33,0 20px 50px #0008;animation:rev 1.4s cubic-bezier(.2,.8,.2,1) both}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes rev{from{opacity:0;transform:scale(.7);filter:blur(12px)}}
#wish{min-height:7.5em;max-width:460px;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(19px,5vw,25px);line-height:1.45;padding:0 8px}
#wish span.c{display:inline-block;width:2px;background:var(--gold);margin-left:2px;animation:bl .8s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.small{opacity:.8;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<canvas id="cv"></canvas>

<section class="screen" id="s3">
<div id="wish" aria-live="polite"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
<button id="gen">Generate a new wish</button>
<button class="ghost" id="again">Blow again</button>
</div>
</section>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var done=false,ctx,stream,raf;
var cv=$('cv'),g=cv.getContext('2d'),parts=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(){var cols=['#ff8fab','#ffd27a','#b8f0d8','#fff4ea','#c9a7ff'];
 for(var i=0;i<170;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:Math.random()*2-1,vy:2+Math.random()*3,s:5+Math.random()*6,r:Math.random()*6,vr:Math.random()*.2-.1,c:cols[i%5]});
 loop()}
function loop(){g.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(function(p){return p.y<cv.height+20});
 parts.forEach(function(p){p.x+=p.vx+Math.sin(p.y/30);p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s/1.6);g.restore()});
 if(parts.length)requestAnimationFrame(loop)}
function name(){return $('nm').value.trim()}
function blowOut(){
 if(done)return;done=true;
 if(stream)stream.getTracks().forEach(function(t){t.stop()});cancelAnimationFrame(raf);
 $('cake').classList.add('out');$('s1').classList.add('out');
 $('hint').textContent='Your wish is on its way…';
 setTimeout(function(){
  $('s1').style.display='none';
  var n=name();$('hb').textContent=n?'Happy Birthday, '+n+'!':'Happy Birthday!';
  $('s2').style.display='flex';confetti();scrollTo(0,0);
  setTimeout(function(){$('s3').style.display='flex';newWish();$('s3').scrollIntoView({behavior:'smooth',block:'center'})},2400);
 },1700)}
function listen(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
  stream=s;var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  var an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(s).connect(an);
  var d=new Uint8Array(an.fftSize),hits=0;
  (function t(){an.getByteTimeDomainData(d);var m=0;for(var i=0;i<d.length;i++)m+=Math.abs(d[i]-128);m/=d.length;
   hits=m>14?hits+1:Math.max(0,hits-1);if(hits>8){blowOut();return}raf=requestAnimationFrame(t)})();
 }).catch(function(){})}
$('blow').onclick=blowOut;
$('nm').addEventListener('focus',function(){},{once:true});
listen();
var A=['May this year open doors you didn\u2019t even know were there.','You light up every room you walk into, and today the room is lit up for you.','Here\u2019s to your smile, your kindness and every little thing that makes you, you.','May your day be as sweet as the cake and your year even sweeter.','Wishing you laughter that hurts your cheeks and memories you\u2019ll keep forever.','Another year older, another year more wonderful.','May this birthday be the start of your happiest year yet.','The world is a little brighter, a little kinder and a lot more fun because you are in it.','Wishing you good health, big wins and people who love you loudly.','May every sunrise this year bring you a new reason to smile.','You are proof that the best people are born on the best days.','Here’s to late-night laughs, chai moments and dreams that come true.','May your heart stay light and your pockets stay full of luck.','Your kindness is a gift to everyone around you, and today we celebrate you.','May this year be full of adventures, surprises and sweet success.','Today the stars gather just to say you’re special.','Grow older, but never lose that beautiful spark in your eyes.','May all the love you give come back to you tenfold today.','May every dream you whisper tonight find its way to you.','You deserve all the happiness the universe has stored up for you.'];
var B=['Stay as bright as you are.','Today is entirely yours \u2014 enjoy every second.','The best chapters are still ahead.','Keep shining, keep smiling.','Sending you a big hug and a thousand good wishes.','Never stop being the joy you are.','Cake first, worries later.','You’re one in a million.','Make today unforgettable.','Hugs, cake and endless smiles for you.','Celebrate like there’s no tomorrow.','The best is yet to come.','Keep being wonderfully you.'];
var last=-1,typing;
function newWish(){
 var n=name(),i;do{i=Math.floor(Math.random()*A.length)}while(i===last);last=i;
 var txt=(n?n+', ':'')+A[i].charAt(0).toLowerCase()*0+A[i];
 if(n)txt=n+' \u2014 '+A[i];
 txt+=' '+B[Math.floor(Math.random()*B.length)]+' \uD83C\uDF82';
 var el=$('wish'),k=0;clearInterval(typing);el.innerHTML='<span class="c">&nbsp;</span>';
 typing=setInterval(function(){k++;el.textContent=txt.slice(0,k);if(k>=txt.length){clearInterval(typing)}},32)}
$('gen').onclick=function(){newWish();parts.length||confetti()};
$('again').onclick=function(){location.reload()};
})();
</script></body></html>
